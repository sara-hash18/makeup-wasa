<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Panier | Makeup WA&SA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #faf7f5;
            color: #321b20;
        }

        header {
            background: linear-gradient(135deg, #4d1724, #7d3041, #c47b89);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        header p {
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        nav {
            background: white;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 17px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            text-decoration: none;
            color: #352125;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
        }

        nav a:hover {
            color: #a64d5f;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 50px auto 80px;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .title p {
            font-family: Arial, sans-serif;
            color: #777;
        }

        .cart-item {
            background: white;
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 8px;
            box-shadow: 0 7px 22px rgba(72,36,42,0.10);
        }

        .cart-item img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 5px;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .item-info p {
            font-family: Arial, sans-serif;
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .item-price {
            color: #8b3d4d;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #6d2736;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity span {
            font-family: Arial, sans-serif;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .remove {
            border: none;
            background: transparent;
            color: #a64d5f;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .summary {
            background: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 8px;
            box-shadow: 0 7px 22px rgba(72,36,42,0.10);
            text-align: right;
        }

        .summary h3 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        .total {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #8b3d4d;
            margin-bottom: 20px;
        }

        .checkout {
            border: none;
            background: #6d2736;
            color: white;
            padding: 14px 35px;
            border-radius: 30px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: 0.3s;
        }

        .checkout:hover {
            background: #a64d5f;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 8px;
            box-shadow: 0 7px 22px rgba(72,36,42,0.10);
        }

        .empty h3 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .empty p {
            font-family: Arial, sans-serif;
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            background: #6d2736;
            color: white;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-family: Arial, sans-serif;
        }

        footer {
            background: #351c22;
            color: white;
            text-align: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            nav {
                gap: 18px;
            }

            nav a {
                font-size: 11px;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-item img {
                width: 90px;
                height: 90px;
            }

            .summary {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>💄 Makeup WA&SA</h1>
    <p>La beauté commence avec toi ✨</p>
</header>

<nav>
    <a href="makeuo.html">ACCUEIL</a>
    <a href="produits.html">PRODUITS</a>
    <a href="rouge-details.html">ROUGES</a>
</nav>

<div class="container">

    <div class="title">
        <h2>Mon Panier 🛍</h2>
        <p>Retrouvez ici les produits que vous avez sélectionnés.</p>
    </div>

    <div id="cartContainer"></div>

</div>

<footer>
    © 2026 Makeup WA&SA — Tous droits réservés ✨
</footer>

<script>

function getCart() {
    return JSON.parse(localStorage.getItem("makeupCart")) || [];
}

function saveCart(cart) {
    localStorage.setItem("makeupCart", JSON.stringify(cart));
}

function displayCart() {

    const cart = getCart();

    const container = document.getElementById("cartContainer");

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <h3>
                    Votre panier est vide 🛍
                </h3>

                <p>
                    Découvrez nos produits et ajoutez vos favoris.
                </p>

                <a href="produits.html" class="shop-btn">
                    Découvrir les produits
                </a>

            </div>
        `;

        return;
    }

    let html = "";

    let total = 0;

    cart.forEach((item, index) => {

        const itemTotal = item.price * item.quantity;

        total += itemTotal;

        html += `

            <div class="cart-item">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="item-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        ${item.brand || "Makeup WA&SA"}
                    </p>

                    <div class="item-price">
                        ${item.price} DH
                    </div>

                </div>

                <div class="quantity">

                    <button onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                </div>

                <button
                    class="remove"
                    onclick="removeItem(${index})">

                    🗑 Supprimer

                </button>

            </div>
        `;
    });

    html += `

        <div class="summary">

            <h3>
                Total
            </h3>

            <div class="total">
                ${total} DH
            </div>

            <button
                class="checkout"
                onclick="checkout()">

                Passer la commande ✨

            </button>

        </div>

    `;

    container.innerHTML = html;
}


function changeQuantity(index, change) {

    const cart = getCart();

    cart[index].quantity += change;

    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }

    saveCart(cart);

    displayCart();
}


function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    displayCart();
}


function checkout() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Votre panier est vide 🛍");

        return;
    }

    window.location.href=
"commande.html";
}


displayCart();

</script>

</body>
</html>
